name: Deploy Tagged Release
on:
  release:
    types:
      - released
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
jobs:
  update-components:
    runs-on: ubuntu-latest
    steps:
      - uses: cluebotng/ci-update-component-ref@057bec9a3909763faf5ce4901d4450a1c3aa3c37 # v1.7.0
        with:
          tool: '*'
          repository: 'https://github.com/cluebotng/bot.git'
          ref: '${{ inputs.ref || github.ref }}'
          gh_app_key: '${{ secrets.CI_COMPONENT_CONFIGS_APP_KEY }}'
