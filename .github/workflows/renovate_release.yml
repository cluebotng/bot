name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@272b5bb5362a4bfc382e2eb9467b9733df321cf7 # v1.9.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [renovate-release]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: 'refs/tags/${{ needs.renovate-release.outputs.tag_name }}'
    secrets: inherit
    if: needs.renovate-release.outputs.tag_name != ''
