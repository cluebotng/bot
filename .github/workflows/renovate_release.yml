name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@2fc53eb4d5048f4375dc3fe7ec0f76d31d573d2c # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [renovate-release]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: 'refs/tags/${{ needs.renovate-release.outputs.tag_name }}'
    secrets: inherit
    if: needs.renovate-release.outputs.tag_name != ''
