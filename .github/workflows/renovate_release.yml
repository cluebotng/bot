name: Create Release For Renovate
on: { push: { branches: [ 'main' ] } }
jobs:
  renovate-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.renovate-release.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - id: renovate-release
        uses: infrabits/ci-create-renovate-release@b7f4832b2f557608a13a04b6b9a0da8a2bc5f7ed # v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [renovate-release]
    uses: ./.github/workflows/deploy.yml
    with:
      ref: 'refs/tags/${{ needs.renovate-release.outputs.tag_name }}'
    secrets: inherit
    if: needs.renovate-release.outputs.tag_name != ''
