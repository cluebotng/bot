name: Create Release For Tag
on: { push: { tags: [ 'v*' ] } }
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@9be5b1cb5cae1e62c560c6a1efde7172f2688817 # v1.6.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: '${{ github.ref }}'

  deploy:
    needs: [create-release]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
