name: Create Release For Tag
on: { push: { tags: [ 'v*' ] } }
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: infrabits/ci-create-missing-release@73b7177537a8878ba996e3bf8ce447a784db05f2 # v1.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: '${{ github.ref }}'

  deploy:
    needs: [create-release]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
